/* BYOK responsive layout and accessibility fixes */
html, body { height:100%; min-height:100%; font-size:16px; }
body { min-height:100dvh; }
.app { height:100dvh; min-height:0; overflow:hidden; }
.sidebar { height:100%; min-height:0; overflow:hidden; }
.sidebar-scroll { flex:1 1 0; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:#34415f transparent; }
.sidebar-bottom { flex:0 0 auto; margin-top:0; }
.main { height:100%; min-height:0; overflow:hidden; }
.main-scroll { flex:1 1 0; height:0; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
.view { min-width:0; }
#view-chat.view { height:100%; min-height:0; overflow:hidden; }
.chat-wrap { min-height:0; }
.messages { min-height:0; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.md { font-size:16px; line-height:1.7; }
.md h1 { font-size:27px; }
.md h2 { font-size:22px; }
.md h3 { font-size:18px; }
.md table { font-size:14px; }
.composer textarea, .textarea, .input, .select { font-size:16px; }
.card p { font-size:14px; }
.section-sub { font-size:14px; }
.mobile-new-chat { display:none; }
button, a { -webkit-tap-highlight-color:transparent; }

@media (max-width:850px) {
  .main { min-height:0; }
  .sidebar { padding-inline:10px; }
}

  .sidebar { position:fixed; left:0; top:0; bottom:0; width:min(310px,88vw); height:100dvh; max-height:100dvh; padding:calc(12px + env(safe-area-inset-top, 0px)) 12px calc(8px + env(safe-area-inset-bottom, 0px)); transform:translateX(-104%); transition:transform .24s ease; box-shadow:var(--shadow); z-index:25; }

function enhanceMarkdown(root,{deferHeavy=false}={}){
 if(!root)return;
 const containers=[];
 if(root.matches?.('.md'))containers.push(root);
 containers.push(...root.querySelectorAll('.md'));
 for(const md of containers){
  // Make wide GFM tables horizontally scrollable without breaking page width.
  md.querySelectorAll('table').forEach(table=>{
   if(table.parentElement?.classList.contains('md-table-wrap'))return;
   const wrap=document.createElement('div');wrap.className='md-table-wrap';
   table.parentNode.insertBefore(wrap,table);wrap.appendChild(table);
  });
  // Open external links safely and avoid leaking the opener context.
  md.querySelectorAll('a[href]').forEach(link=>{
   const href=link.getAttribute('href')||'';
   if(href.startsWith('#'))return;
   try{
    const url=new URL(href,document.baseURI);
    if(!['http:','https:','mailto:','tel:'].includes(url.protocol)){link.removeAttribute('href');return;}
    if(url.protocol==='http:'||url.protocol==='https:'){
     link.target='_blank';link.rel='noopener noreferrer';
    }
   }catch{link.removeAttribute('href');}
  });
  md.querySelectorAll('img').forEach(img=>{img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer'});
  md.querySelectorAll('pre > code').forEach(code=>{
   if(!deferHeavy&&window.hljs?.highlightElement&&!code.dataset.highlighted){
    try{window.hljs.highlightElement(code);code.dataset.highlighted='true';}catch(error){console.debug('Code highlighting skipped:',error)}
   }
   const pre=code.parentElement;
   if(pre&&!pre.querySelector('.code-copy')){
    const button=document.createElement('button');button.type='button';button.className='code-copy';button.textContent='Copy code';button.setAttribute('aria-label','Copy code block');
    button.addEventListener('click',async()=>{const text=code.textContent||'';try{await navigator.clipboard.writeText(text);button.textContent='Copied';setTimeout(()=>button.textContent='Copy code',1300);}catch{button.textContent='Copy unavailable';setTimeout(()=>button.textContent='Copy code',1500);}});
    pre.appendChild(button);
   }
  });
  // Obsidian-style inline and display math using KaTeX auto-render.
  if(!deferHeavy&&window.renderMathInElement){
   try{window.renderMathInElement(md,{
    delimiters:[
     {left:'$$',right:'$$',display:true},
     {left:'\\[',right:'\\]',display:true},
     {left:'\\(',right:'\\)',display:false},
     {left:'$',right:'$',display:false}
    ],
    ignoredTags:['script','noscript','style','textarea','pre','code','option'],
    throwOnError:false,strict:'ignore'
   });}catch(error){console.debug('Math rendering skipped:',error)}
  }
 }
}

async function exportVaultZip(){
 if(typeof JSZip==='undefined'){toast('ZIP support could not load. Check your connection and try again.','error');return;}
 try{
  const zip=new JSZip();let count=0;
  if(state.vault&&state.vaultReady){
   async function addDirectory(dir,prefix=''){
    for await(const [name,handle] of dir.entries()){
     const path=prefix?prefix+'/'+name:name;
     if(handle.kind==='directory'){zip.folder(path);await addDirectory(handle,path);}
     else{const file=await handle.getFile();zip.file(path,file);count++;}
    }
   }
   await addDirectory(state.vault);
  }

  for(const chat of state.chats.filter(x=>x.kind==='chat')){zip.file(vaultPathForRecord(chat),serialize(chat));count++;}

  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  download('BYOK-Backup-'+new Date().toISOString().slice(0,10)+'.zip',blob,'application/zip');
  toast(`Backup exported (${count} files). Chats were read from browser storage; vault files were included only if a vault is connected.`,'success');
 }catch(e){toast('Could not export backup: '+e.message,'error');}

 if(!state.vault||!state.vaultReady){let imported=0,skipped=0;for(const file of files){try{const rel=(file.webkitRelativePath||file.name).split('/');const parent=safeVaultSegments(rel.slice(1,-1).join('/')).join('/');const r=parseMarkdown(await file.text(),file.name);if(r.kind!=='chat'){skipped++;continue;}r.id=r.id||uid();if(parent)r.folder=parent;if(!state.folders.includes(r.folder))state.folders.push(r.folder);const existing=state.chats.findIndex(x=>x.id===r.id);if(existing>=0&&new Date(r.updatedAt||0)<new Date(state.chats[existing].updatedAt||0)){skipped++;continue;}if(await persist(r)){if(existing>=0)state.chats[existing]=r;else state.chats.unshift(r);imported++;}else skipped++;}catch(error){console.warn('Could not import browser chat:',file.name,error);skipped++;}}await saveVaultFolders();renderAll();toast(`Imported ${imported} chat(s) into browser storage${skipped?' · '+skipped+' note/invalid file(s) skipped because no vault is connected':''}`,'success');return;}

async function importVaultZip(file){

 if(typeof JSZip==='undefined'){toast('ZIP support could not load. Import Markdown files instead.','error');return;}
 if(!state.vault||!state.vaultReady){
  let importedChats=0,skippedChats=0;
  try{
   const zip=await JSZip.loadAsync(file);
   for(const entry of Object.values(zip.files).filter(x=>!x.dir&&x.name.toLowerCase().endsWith('.md')&&!x.name.startsWith('Settings/')&&!x.name.startsWith('Attachments/'))){
    try{
     const parts=entry.name.replace(/\\/g,'/').split('/').filter(Boolean);if(parts.some(x=>x==='.'||x==='..')){skippedChats++;continue;}
     const fileName=parts.pop()||'Imported.md',folder=safeVaultSegments(parts.join('/')).join('/');
     const r=parseMarkdown(await entry.async('string'),fileName);if(r.kind!=='chat'){skippedChats++;continue;}
     if(folder)r.folder=folder;delete r._fileName;delete r._fileFolder;
     const existing=state.chats.findIndex(x=>x.id===r.id);
     if(existing>=0&&new Date(r.updatedAt||0)<new Date(state.chats[existing].updatedAt||0)){skippedChats++;continue;}
     if(await persist(r)){if(existing>=0)state.chats[existing]=r;else state.chats.unshift(r);if(r.folder&&!state.folders.includes(r.folder))state.folders.push(r.folder);importedChats++;}else skippedChats++;
    }catch(error){console.warn('Could not import chat archive entry:',entry.name,error);skippedChats++;}
   }
   await saveVaultFolders();renderAll();toast(`Imported ${importedChats} chat(s) into browser storage${skippedChats?' · '+skippedChats+' other/older file(s) skipped':''}`,'success');
  }catch(error){toast('Could not read chat backup: '+error.message,'error');}
  return;
 }
 let imported=0,skipped=0,otherFiles=0;
 try{
  const zip=await JSZip.loadAsync(file);
  const entries=Object.values(zip.files).filter(x=>!x.dir);
  // Restore non-Markdown vault data first: settings, encrypted credentials and attachment assets.
  for(const entry of entries){
   const path=entry.name.replace(/\\/g,'/').replace(/^\/+/, '');
   if(path.split('/').some(part=>!part||part==='.'||part==='..')){skipped++;continue;}
   if(path.startsWith('Settings/')){
    const content=await entry.async('string');const relative=path.slice('Settings/'.length);
    await writeVaultFile('Settings',relative,content);otherFiles++;
    if(relative===APP_SETTINGS_FILE){try{const v=JSON.parse(content);if(v.version===1){state.configs=v.configs||state.configs;state.provider=v.provider||state.provider;state.model=v.model||state.model;}}catch{}}
    if(relative===FOLDERS_FILE){try{const v=JSON.parse(content);if(Array.isArray(v.folders))state.folders=[...new Set([...state.folders,...v.folders])];}catch{}}
   }else if(path.startsWith('Attachments/')){
    const parts=path.split('/');const name=parts.pop();const folder=parts.join('/');
    if(path.toLowerCase().endsWith('.md'))await writeVaultFile(folder,name,await entry.async('string'));
    else await writeVaultBlob(folder,name,await entry.async('blob'));
    otherFiles++;
   }
  }
  for(const entry of entries.filter(x=>x.name.toLowerCase().endsWith('.md')&&!x.name.startsWith('Attachments/')&&!x.name.startsWith('Settings/'))){
   try{
    const rawParts=entry.name.replace(/\\/g,'/').split('/').filter(Boolean);if(rawParts.some(part=>part==='.'||part==='..')){skipped++;continue;}const fileName=rawParts.pop()||'Imported.md';const folderPath=safeVaultSegments(rawParts.join('/')).join('/');
    const r=parseMarkdown(await entry.async('string'),fileName);
    if(folderPath==='.trash'||folderPath.startsWith('.trash/'))r.deleted=true;else if(folderPath)r.folder=folderPath;
    if(!r.folder)r.folder=r.kind==='note'?'Notes':'Chats';
    if(r.folder&&r.folder!=='.trash'&&!state.folders.includes(r.folder))state.folders.push(r.folder);
    const index=state.chats.findIndex(x=>x.id===r.id);
    if(index>=0){const current=state.chats[index];if(new Date(r.updatedAt)<new Date(current.updatedAt)){skipped++;continue;}state.chats[index]=r;}else state.chats.unshift(r);
    if(await persist(r))imported++;else skipped++;
   }catch(error){console.warn('Could not import ZIP entry:',entry.name,error);skipped++;}
  }
  state.models=[];await loadVaultSettings();await saveVaultFolders();await saveConfig();
  credentialVaultKey=null;state.credentials={};state.credentialVaultSalt=null;
  renderAll();toast(`Vault imported: ${imported} documents, ${otherFiles} settings/assets${skipped?' · '+skipped+' skipped':''}. Older credentials from another encryption format were not imported; reconnect that provider to save a new browser-managed key.`,'success');
 }catch(error){toast('Could not read this ZIP archive: '+error.message,'error');}
}

function attachLongPress(element,callback){
 let timer=null,startX=0,startY=0,fired=false,suppressClickUntil=0;
 const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}element.classList.remove('long-pressed');};
 element.addEventListener('pointerdown',event=>{
  if(event.button!==undefined&&event.button!==0)return;
  const interactive=event.target.closest('button,input,a,textarea,select');if(interactive&&interactive!==element)return;
  startX=event.clientX;startY=event.clientY;fired=false;
  timer=setTimeout(()=>{timer=null;fired=true;suppressClickUntil=Date.now()+900;element.classList.add('long-pressed');playFeedback('long');callback();setTimeout(()=>element.classList.remove('long-pressed'),220);},520);
 },{passive:true});
 element.addEventListener('pointermove',event=>{if(timer&&(Math.abs(event.clientX-startX)>12||Math.abs(event.clientY-startY)>12))cancel();},{passive:true});
 element.addEventListener('pointerup',()=>{if(timer)cancel();},{passive:true});
 element.addEventListener('pointercancel',cancel,{passive:true});
 element.addEventListener('contextmenu',event=>{event.preventDefault();if(!fired){fired=true;suppressClickUntil=Date.now()+900;cancel();playFeedback('long');callback();}},{passive:false});
 element.addEventListener('click',event=>{if(Date.now()<suppressClickUntil){event.preventDefault();event.stopImmediatePropagation();suppressClickUntil=0;}},true);
 return ()=>fired;
}

 $$('.file-item[data-record-id]').forEach(row=>{
  const getRecord=()=>state.chats.find(x=>x.id===row.dataset.recordId);

 });

$('#vaultZipImportInput').addEventListener('change',async e=>{await importVaultZip(e.target.files?.[0]);e.target.value=''});
$('#newChat').onclick=()=>{playFeedback('tap');createChat()};$('#quickNote').onclick=()=>{playFeedback('tap');createNote()};$('#topNewNote')?.addEventListener('click',()=>{playFeedback('tap');createNote()});
 $('#sidebarClose').onclick=closeSidebar;$('#sidebarVault').onclick=()=>pickVault();$('#treeSearch').oninput=()=>renderFolders();$('#treeSort').onclick=()=>{treeSortRecent=!treeSortRecent;renderFolders();toast(treeSortRecent?'Sorted by recent activity':'Sorted by name')};$('#collapseFolders').onclick=()=>{expandedFolders.clear();renderFolders()};$('#mobileNewChat').onclick=()=>{playFeedback('tap');state.view==='notes'?createNote():createChat()};$('#topSettings').onclick=()=>setView('settings');$('#addFolder').onclick=()=>{playFeedback('tap');addFolder()};
$('#menuBtn').onclick=()=>{const isOpen=$('#sidebar').classList.contains('open');if(isOpen){closeSidebar();}else{$('#sidebar').classList.add('open');$('#scrim').classList.add('show');$('#menuBtn').setAttribute('aria-expanded','true');playFeedback('modal');}};
$('#scrim').onclick=()=>{closeSidebar();playFeedback('back')};
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch')?.focus();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&!e.shiftKey){e.preventDefault();createChat();}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();createNote();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSidebar();closeModal();playFeedback('back')}});
$$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#mobileNav').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
window.addEventListener('popstate',event=>{
 const modalOpen=$('#modalBackdrop').classList.contains('open'),drawerOpen=$('#sidebar').classList.contains('open');
 if(modalOpen||drawerOpen){
  const current=navSnapshot();closeModal();closeSidebar();history.pushState({__byok:true,byokScreen:current},'',location.href);playFeedback('back');return;
 }
 const snapshot=event.state?.byokScreen;
 if(snapshot){restoreNavigation(snapshot);playFeedback('back');if(event.state?.byokRoot)toast('Press Back again to leave BYOK');}
 else{toast('Press Back again to leave BYOK');}
});
initScrollFeedback();
renderIcons(document);
// Restore the most recently opened real document, if one exists.
await init();if(!state.activeId){const first=state.chats.find(c=>!c.deleted&&c.kind==='chat');if(first)state.activeId=first.id}renderAll();const initialNav=state.activeId?{view:'chat',activeId:state.activeId,folder:state.folder,filter:state.filter}:navSnapshot();initializeNavigationHistory(initialNav);if(state.activeId)openChat(state.activeId,{push:false});
</script>
</body>
</html>
