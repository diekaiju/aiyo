/* BYOK responsive layout and accessibility fixes */
html, body { height:100%; min-height:100%; font-size:16px; }
body { min-height:100dvh; }
.app { height:100dvh; min-height:0; overflow:hidden; }
.sidebar { height:100%; min-height:0; overflow:hidden; }
.sidebar-scroll { flex:1 1 0; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:#34415f transparent; }
.sidebar-bottom { flex:0 0 auto; margin-top:0; }
.main { height:100%; min-height:0; overflow:hidden; }
.main-scroll { flex:1 1 0; height:0; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
.view { min-width:0; }
#view-chat.view { height:100%; min-height:0; overflow:hidden; }
.chat-wrap { min-height:0; }
.messages { min-height:0; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.md { font-size:16px; line-height:1.7; }
.md h1 { font-size:27px; }
.md h2 { font-size:22px; }
.md h3 { font-size:18px; }
.md table { font-size:14px; }
.composer textarea, .textarea, .input, .select { font-size:16px; }
.card p { font-size:14px; }
.section-sub { font-size:14px; }
.mobile-new-chat { display:none; }
button, a { -webkit-tap-highlight-color:transparent; }

@media (max-width:850px) {
  .main { min-height:0; }
  .sidebar { padding-inline:10px; }
}

  .sidebar { position:fixed; left:0; top:0; bottom:0; width:min(310px,88vw); height:100dvh; max-height:100dvh; padding:calc(12px + env(safe-area-inset-top, 0px)) 12px calc(8px + env(safe-area-inset-bottom, 0px)); transform:translateX(-104%); transition:transform .24s ease; box-shadow:var(--shadow); z-index:25; }

function serialize(record){let out=frontmatter(record);if(record.kind==='note')return out+(record.noteContent||'')+'\n';for(const m of record.messages||[]){out+=`<!-- BYOK_MESSAGE ${m.role} ${m.createdAt||''} -->\n${m.content||''}\n<!-- /BYOK_MESSAGE -->\n\n`;}if(record.attachments?.length){out+=`<!-- BYOK_ATTACHMENTS ${btoa(unescape(encodeURIComponent(JSON.stringify(record.attachments))))} -->\n`;}return out}
function parseMarkdown(text,fallbackName='Imported note'){
 const front=text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);const meta={};if(front){for(const line of front[1].split('\n')){const m=line.match(/^([\w_]+):\s*(.*)$/);if(m){let v=m[2];try{v=JSON.parse(v)}catch{}meta[m[1]]=v;}}}
 const rec={id:meta.id||uid(),kind:meta.byok_type==='chat'?'chat':'note',title:meta.title||fallbackName.replace(/\.md$/i,''),folder:meta.folder||'Chats',provider:meta.provider||'',model:meta.model||'',createdAt:meta.created_at||new Date().toISOString(),updatedAt:meta.updated_at||new Date().toISOString(),favorite:meta.favorite===true||meta.favorite==='true',deleted:meta.deleted===true||meta.deleted==='true',messages:[],attachments:[]};
 const body=front?text.slice(front[0].length):text;if(rec.kind==='note'){rec.noteContent=body.replace(/^# .*?(?:\n|$)/,'').trim();return rec;}const re=/<!-- BYOK_MESSAGE (user|assistant|system) ([^>]*) -->\n([\s\S]*?)\n<!-- \/BYOK_MESSAGE -->/g;let m;while((m=re.exec(text)))rec.messages.push({role:m[1],createdAt:m[2]||'',content:m[3]});

}

async function loadVault(){

 const found=[];
 async function scan(dir,folder=''){
  for await(const [name,h] of dir.entries()){
   const path=folder?folder+'/'+name:name;
   if(h.kind==='file'&&name.toLowerCase().endsWith('.md')&&!path.split('/').includes('Attachments')){
    try{
     const f=await h.getFile(),r=parseMarkdown(await f.text(),name);
     const parent=folder||'';
     if(parent==='.trash'||parent.startsWith('.trash/'))r.deleted=true;
     if(parent&&parent!=='.trash'&&!parent.startsWith('.trash/'))r.folder=parent;
     else if(!parent)r.folder=r.kind==='note'?'Notes':'Chats';
     r._fileName=name;r._fileFolder=folder;found.push(r);
     if(r.folder&&r.folder!=='Chats'&&r.folder!=='Notes'&&!state.folders.includes(r.folder))state.folders.push(r.folder);
    }catch(e){console.warn('Skip vault file',name,e)}
   }else if(h.kind==='directory'&&!['Attachments','Templates'].includes(name)){
    if(name!=='.trash'&&!state.folders.includes(path))state.folders.push(path);
    await scan(h,path);
   }
  }
 }
 await scan(state.vault,'');
 await dbPut('meta',{key:'folders',value:state.folders});
 const cached=await dbAll('chats')||[];
 const diskIds=new Set(found.map(r=>r.id));
 state.chats=[...found,...cached.filter(r=>!diskIds.has(r.id))];
 for(const r of found)await dbPut('chats',r);
 // Recover browser-only records into the selected vault so the files become the portable source of truth.
 for(const r of cached.filter(x=>!diskIds.has(x.id)&&!x.deleted))await persist(r);
}

function initChatReaderChrome(box){

 setReaderChromeHidden(false);
 box.dataset.readerScrollBound='1';
 let lastTop=box.scrollTop,direction=0,distance=0,userIntentUntil=0;
 const markUserScroll=()=>{userIntentUntil=performance.now()+1100;};

  const top=box.scrollTop;const delta=top-lastTop;lastTop=top;
  if(performance.now()>userIntentUntil)return; // ignore auto-scrolls caused by rendering or streaming

  if(Math.abs(delta)<1)return;
  const next=delta>0?1:-1;
  if(next!==direction){direction=next;distance=0;}
  distance+=Math.abs(delta);
  const now=performance.now();

  else if(direction===-1&&distance>=22){setReaderChromeHidden(false);distance=0;}

function renderMarkdown(src=''){
 const markdown=String(src??'').replace(/\r\n?/g,'\n').replace(/^[\u200B\u200C\u200D\u200E\u200F\uFEFF]/,'');
 // Never inject parser output unless the sanitizer is available. This fallback
 // keeps content readable when a CDN is blocked or the device is offline.
 if(!window.marked?.parse||!window.DOMPurify?.sanitize){return `<pre class="md-source-fallback">${esc(markdown)}</pre>`;}
 try{
  const dirty=window.marked.parse(markdown,{gfm:true,breaks:false,pedantic:false,async:false});
  const clean=window.DOMPurify.sanitize(dirty,{USE_PROFILES:{html:true},ADD_ATTR:['class','target','rel','align','start','colspan','rowspan']});
  return String(clean);
 }catch(error){console.warn('Markdown rendering failed; showing source text instead.',error);return `<pre class="md-source-fallback">${esc(markdown)}</pre>`;}
}

function enhanceMarkdown(root,{deferHeavy=false}={}){
 if(!root)return;
 const containers=[];
 if(root.matches?.('.md'))containers.push(root);
 containers.push(...root.querySelectorAll('.md'));
 for(const md of containers){
  // Make wide GFM tables horizontally scrollable without breaking page width.
  md.querySelectorAll('table').forEach(table=>{
   if(table.parentElement?.classList.contains('md-table-wrap'))return;
   const wrap=document.createElement('div');wrap.className='md-table-wrap';
   table.parentNode.insertBefore(wrap,table);wrap.appendChild(table);
  });
  // Open external links safely and avoid leaking the opener context.
  md.querySelectorAll('a[href]').forEach(link=>{
   const href=link.getAttribute('href')||'';
   if(href.startsWith('#'))return;
   try{
    const url=new URL(href,document.baseURI);
    if(!['http:','https:','mailto:','tel:'].includes(url.protocol)){link.removeAttribute('href');return;}
    if(url.protocol==='http:'||url.protocol==='https:'){
     link.target='_blank';link.rel='noopener noreferrer';
    }
   }catch{link.removeAttribute('href');}
  });
  md.querySelectorAll('img').forEach(img=>{img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer'});
  md.querySelectorAll('pre > code').forEach(code=>{
   if(!deferHeavy&&window.hljs?.highlightElement&&!code.dataset.highlighted){
    try{window.hljs.highlightElement(code);code.dataset.highlighted='true';}catch(error){console.debug('Code highlighting skipped:',error)}
   }
   const pre=code.parentElement;
   if(pre&&!pre.querySelector('.code-copy')){
    const button=document.createElement('button');button.type='button';button.className='code-copy';button.textContent='Copy code';button.setAttribute('aria-label','Copy code block');
    button.addEventListener('click',async()=>{const text=code.textContent||'';try{await navigator.clipboard.writeText(text);button.textContent='Copied';setTimeout(()=>button.textContent='Copy code',1300);}catch{button.textContent='Copy unavailable';setTimeout(()=>button.textContent='Copy code',1500);}});
    pre.appendChild(button);
   }
  });
  // Obsidian-style inline and display math using KaTeX auto-render.
  if(!deferHeavy&&window.renderMathInElement){
   try{window.renderMathInElement(md,{
    delimiters:[
     {left:'$$',right:'$$',display:true},
     {left:'\\[',right:'\\]',display:true},
     {left:'\\(',right:'\\)',display:false},
     {left:'$',right:'$',display:false}
    ],
    ignoredTags:['script','noscript','style','textarea','pre','code','option'],
    throwOnError:false,strict:'ignore'
   });}catch(error){console.debug('Math rendering skipped:',error)}
  }
 }
}

async function exportVaultZip(){
 const records=state.chats.filter(c=>!c.deleted);
 if(!records.length){toast('There are no documents to export');return}
 if(typeof JSZip==='undefined'){
  records.forEach(downloadMarkdown);
  toast('ZIP library did not load. Downloaded Markdown files individually instead.','error');
  return;
 }
 try{
  const zip=new JSZip();
  for(const c of records)zip.file(vaultPathForRecord(c),serialize(c));
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  download('BYOK-Vault-'+new Date().toISOString().slice(0,10)+'.zip',blob,'application/zip');
  toast('Vault exported as a ZIP archive','success');
 }catch(e){toast('Could not export vault: '+e.message,'error')}
}
async function importVaultFolderFiles(fileList){
 const files=Array.from(fileList||[]).filter(f=>f.name.toLowerCase().endsWith('.md'));
 if(!files.length){toast('No Markdown files were found in that folder','error');return}
 let imported=0,skipped=0;
 for(const file of files){
  try{
   const rel=(file.webkitRelativePath||file.name).split('/');
   const parts=rel.length>1?rel.slice(1):rel;
   if(parts.some(p=>p==='Attachments'||p==='Templates')){skipped++;continue}
   const dirParts=parts.slice(0,-1);
   const r=parseMarkdown(await file.text(),file.name);
   const folderPath=dirParts.join('/');
   if(folderPath==='.trash'||folderPath.startsWith('.trash/'))r.deleted=true;
   if(folderPath&&!folderPath.startsWith('.trash/'))r.folder=folderPath;
   else if(!r.folder)r.folder=r.kind==='note'?'Notes':'Chats';
   if(r.folder&&r.folder!=='Chats'&&r.folder!=='Notes'&&!state.folders.includes(r.folder))state.folders.push(r.folder);
   const existing=state.chats.findIndex(x=>x.id===r.id);
   if(existing>=0){
    const current=state.chats[existing];
    if(new Date(r.updatedAt)<new Date(current.updatedAt)){skipped++;continue;}
    state.chats[existing]=r;
   }else state.chats.unshift(r);
   await persist(r);imported++;
  }catch(e){console.warn('Could not import Markdown file',file.name,e);skipped++}
 }
 await dbPut('meta',{key:'folders',value:state.folders});
 renderAll();
 toast(`Imported ${imported} Markdown file${imported===1?'':'s'}${skipped?` · skipped ${skipped}`:''}`,'success');
}
async function importVaultZip(file){
 if(!file)return;
 if(typeof JSZip==='undefined'){toast('ZIP support could not load. Import Markdown files instead.','error');return;}
 let imported=0,skipped=0;
 try{
  const zip=await JSZip.loadAsync(file);
  const entries=Object.values(zip.files).filter(x=>!x.dir&&x.name.toLowerCase().endsWith('.md')&&!x.name.split('/').some(p=>['Attachments','Templates'].includes(p)));
  for(const entry of entries){
   try{
    const parts=entry.name.split('/').filter(Boolean);const fileName=parts.pop()||'Imported.md';
    const folderPath=parts.join('/');const r=parseMarkdown(await entry.async('string'),fileName);
    if(folderPath==='.trash'||folderPath.startsWith('.trash/'))r.deleted=true;
    else if(folderPath)r.folder=folderPath;
    if(!r.folder)r.folder=r.kind==='note'?'Notes':'Chats';
    if(r.folder&&r.folder!=='.trash'&&!state.folders.includes(r.folder))state.folders.push(r.folder);
    const index=state.chats.findIndex(x=>x.id===r.id);
    if(index>=0){const current=state.chats[index];if(new Date(r.updatedAt)<new Date(current.updatedAt)){skipped++;continue;}state.chats[index]=r;}
    else state.chats.unshift(r);
    await persist(r);imported++;
   }catch(error){console.warn('Could not import ZIP entry:',entry.name,error);skipped++;}
  }
  await dbPut('meta',{key:'folders',value:state.folders});renderAll();
  toast(`Imported ${imported} Markdown file${imported===1?'':'s'} from ZIP${skipped?' · skipped '+skipped:''}`,'success');
 }catch(error){toast('Could not read this ZIP archive: '+error.message,'error');}
}

async function sendToAI(c){if(state.isSending)return;const provider=c.provider||state.provider;const cred=state.credentials[provider]?.key||'';if(!cred){state.provider=provider;openProviderModal();toast('Add the API key for '+(PROVIDERS[provider]?.name||provider)+' to continue.','error');return}const model=c.model||(provider===state.provider?state.model:'');if(!model){state.provider=provider;openModelPicker();toast('Choose a model for this conversation first.');return}state.isSending=true;state.abort=new AbortController();const assistant={role:'assistant',content:'',createdAt:new Date().toISOString()};c.messages.push(assistant);renderChat();const btn=$('#sendBtn');btn.textContent='■';btn.classList.add('stop');const status=$('#saveStatus');if(status)status.textContent='Generating…';try{const messages=c.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(0,-1);let system=systemText(c);const result=await providerStream({provider,model,credential:cred,messages,system,signal:state.abort.signal,onDelta:delta=>{assistant.content+=delta;queueRenderChat(c.id)}});if(!assistant.content&&result)assistant.content=result; if(!assistant.content)assistant.content='(The provider returned an empty response.)';}catch(e){if(e.name==='AbortError'){if(!assistant.content)assistant.content='*Generation stopped.*'}else{assistant.content=assistant.content?assistant.content+`\n\n> **Request error:** ${e.message}`:`**Request error:** ${e.message}`;toast(e.message,'error')}}finally{state.isSending=false;state.abort=null;const current=state.chats.find(x=>x.id===c.id);if(current){await persist(current);if(state.activeId===c.id)renderChat()}const sb=$('#saveStatus');if(sb)sb.textContent='Saved';const b=$('#sendBtn');if(b){b.textContent='➤';b.classList.remove('stop')}}}

async function providerStream({provider,model,credential,messages,system,signal,onDelta}){const cfg=providerConfig(provider),base=(cfg.base||PROVIDERS[provider].base).replace(/\/$/,'');if(provider==='gemini')return geminiStream({base,model,credential,messages,system,signal,onDelta});if(provider==='anthropic')return anthropicStream({base,model,credential,messages,system,signal,onDelta});return openAIStream({base,model,credential,messages,system,signal,onDelta,provider})}
async function openAIStream({base,model,credential,messages,system,signal,onDelta,provider}){const headers={'Content-Type':'application/json','Authorization':'Bearer '+credential};if(provider==='openrouter'){headers['HTTP-Referer']=location.origin;headers['X-Title']='BYOK Local Workspace'}const body={model,stream:true,messages:[...(system?[{role:'system',content:system}]:[]),...messages.map(m=>({role:m.role,content:m.content}))]};const r=await fetch(base+'/chat/completions',{method:'POST',headers,body:JSON.stringify(body),signal});if(!r.ok)throw new Error(await responseError(r));return readSSE(r,raw=>{if(raw==='[DONE]')return;const j=JSON.parse(raw);const d=j.choices?.[0]?.delta?.content;if(typeof d==='string')onDelta(d);else if(Array.isArray(d))for(const p of d)if(p.type==='text')onDelta(p.text||'')})}

async function geminiStream({base,model,credential,messages,system,signal,onDelta}){const contents=messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));const url=base+'/models/'+encodeURIComponent(model.replace(/^models\//,''))+':streamGenerateContent?alt=sse';const body={contents,generationConfig:{maxOutputTokens:2048}};if(system)body.systemInstruction={parts:[{text:system}]};const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':credential},body:JSON.stringify(body),signal});if(!r.ok)throw new Error(await responseError(r));return readSSE(r,raw=>{const j=JSON.parse(raw);for(const p of j.candidates?.[0]?.content?.parts||[])if(p.text)onDelta(p.text)})}
async function readSSE(response,onData){const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){const s=line.trim();if(s.startsWith('data:')){const data=s.slice(5).trim();if(data){try{onData(data)}catch(e){if(data!=='[DONE]')console.warn('Could not parse stream event',e)}}}}}if(buffer.trim().startsWith('data:')){try{onData(buffer.trim().slice(5).trim())}catch{}}}

async function fetchModels(provider=state.provider){const key=state.credentials[provider]?.key;if(!key)throw new Error('Add the API key for this provider first.');const cfg=providerConfig(provider),base=(cfg.base||'').replace(/\/$/,'');let models=[];
 if(provider==='gemini'){const r=await fetch(base+'/models?pageSize=1000',{headers:{'x-goog-api-key':key}});if(!r.ok)throw new Error(await responseError(r));const j=await r.json();models=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&!/embedding|aqa|imagen|image|veo|tts|audio/i.test(m.name+' '+m.displayName)).map(m=>({id:m.name.replace(/^models\//,''),name:m.displayName||m.name,detail:'Gemini · generateContent'}));}
 else if(provider==='anthropic'){const r=await fetch(base+'/models?limit=1000',{headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});if(!r.ok)throw new Error(await responseError(r));const j=await r.json();models=(j.data||[]).map(m=>({id:m.id,name:m.display_name||m.id,detail:'Claude · Messages API'}));}
 else if(provider==='openrouter'){const r=await fetch(base+'/models',{headers:{'Authorization':'Bearer '+key}});if(!r.ok)throw new Error(await responseError(r));const j=await r.json();models=(j.data||[]).filter(m=>{const i=m.architecture?.input_modalities||[],o=m.architecture?.output_modalities||[];return i.includes('text')&&o.includes('text')}).map(m=>({id:m.id,name:m.name||m.id,detail:'Text input + text output'}));}
 else {const r=await fetch(base+'/models',{headers:{'Authorization':'Bearer '+key}});if(!r.ok)throw new Error(await responseError(r));const j=await r.json();const rows=j.data||j.models||[];const block=/embed|moderation|whisper|tts|audio|transcri|dall[-_ ]?e|image|imagen|veo|rerank|realtime|speech|video|search/i;const likely=/^(gpt|o[134](?:-|$)|chatgpt|claude|command-r|mistral|deepseek|qwen|llama|gemma|phi|yi|kimi|internlm)/i;models=rows.map(m=>({id:m.id||m.name,name:m.name||m.id,detail:'Provider model list · capabilities may need verification'})).filter(m=>m.id&&!block.test(m.id)&&likely.test(m.id));}

function attachLongPress(element,callback){
 let timer=null,startX=0,startY=0,fired=false,suppressClickUntil=0;
 const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}element.classList.remove('long-pressed');};
 element.addEventListener('pointerdown',event=>{
  if(event.button!==undefined&&event.button!==0)return;
  const interactive=event.target.closest('button,input,a,textarea,select');if(interactive&&interactive!==element)return;
  startX=event.clientX;startY=event.clientY;fired=false;
  timer=setTimeout(()=>{timer=null;fired=true;suppressClickUntil=Date.now()+900;element.classList.add('long-pressed');playFeedback('long');callback();setTimeout(()=>element.classList.remove('long-pressed'),220);},520);
 },{passive:true});
 element.addEventListener('pointermove',event=>{if(timer&&(Math.abs(event.clientX-startX)>12||Math.abs(event.clientY-startY)>12))cancel();},{passive:true});
 element.addEventListener('pointerup',()=>{if(timer)cancel();},{passive:true});
 element.addEventListener('pointercancel',cancel,{passive:true});
 element.addEventListener('contextmenu',event=>{event.preventDefault();if(!fired){fired=true;suppressClickUntil=Date.now()+900;cancel();playFeedback('long');callback();}},{passive:false});
 element.addEventListener('click',event=>{if(Date.now()<suppressClickUntil){event.preventDefault();event.stopImmediatePropagation();suppressClickUntil=0;}},true);
 return ()=>fired;
}

await init();if(!state.chats.length)await seed();if(!state.activeId){const first=state.chats.find(c=>!c.deleted&&c.kind==='chat');if(first)state.activeId=first.id}renderAll();const initialNav=state.activeId?{view:'chat',activeId:state.activeId,folder:state.folder,filter:state.filter}:navSnapshot();initializeNavigationHistory(initialNav);if(state.activeId)openChat(state.activeId,{push:false});
</script>
</body>
